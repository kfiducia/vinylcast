# vinylcast ALSA config → deploy to /etc/asound.conf on the Pi.
#
# The USB ADC (Behringer UCA202, a Burr-Brown/TI PCM2902) is single-open: whoever
# holds it excludes everyone else. The vinyl path needs TWO readers of the same
# line-in at once — the arecord that feeds OwnTone (→ AirPlay speakers) AND the ACR
# sampler that grabs clips for ACRCloud. `dsnoop` lets multiple readers share one
# capture device; the `plug` view gives the sampler a small mono stream.
#
# NOTE: the ADC enumerated as card 2 (`hw:2,0`) on this Pi — verify with `arecord -l`
# after any hardware change; a different card number means editing the slave pcm here.

pcm.vinyl_snoop {
    type dsnoop
    ipc_key 2202
    slave {
        pcm "hw:2,0"
        channels 2
        rate 44100
        format S16_LE
    }
}

# Mono view of the shared capture, for the ACR sampler (keeps ACRCloud clips small).
pcm.vinyl_snoop_mono {
    type plug
    slave.pcm "vinyl_snoop"
}
